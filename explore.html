<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Library - Explore</title>
    <!-- 공통 CSS 파일 연동 -->
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- 상단 헤더 영역 -->
    <header class="header-container">
      <div class="logo-area">
        <h1>結</h1>
      </div>
      <div class="profile-area">
        <div class="profile-icon"></div>
      </div>
    </header>

    <!-- 내비게이션 바 (Explore 활성화) -->
    <nav class="nav-container">
      <a href="home.html" class="nav-item">Home</a>
      <a href="explore.html" class="nav-item active">Explore</a>
      <a href="MyLibrary.html" class="nav-item">My Library</a>
      <a href="records.html" class="nav-item">Records</a>
      <a href="Profile.html" class="nav-item">Profile</a>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-container">
      <section class="section-block explore-section">
        <h2>Explore</h2>
        <!-- 검색 폼 영역 -->
        <form class="search-form" id="exploreForm">
          <div class="search-input-wrapper">
            <input
              type="text"
              id="exploreInput"
              name="explore"
              placeholder="검색어를 입력하세요"
            />
            <!-- 돋보기 버튼 -->
            <button type="submit" class="search-btn">🔍</button>
          </div>
        </form>
      </section>

      <!-- 검색 결과가 출력될 공간 -->
      <section class="section-block">
        <div id="exploreResultContainer" class="results-wrapper">
          <!-- 검색 결과가 여기에 동적으로 들어갑니다 -->
        </div>
      </section>
    </main>

    <!-- 푸터 영역 -->
    <footer class="footer-container">
      <p>개발자 이메일: example@email.com</p>
    </footer>

    <!-- JS 파일 연결 -->
    <script src="main.js"></script>
  </body>
</html>
