<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Library - Test</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="test.css" />
  </head>
  <body>
    <!-- 상단 헤더 -->
    <header class="header-container">
      <div class="logo-area">
        <h1>結</h1>
      </div>
      <div class="profile-area">
        <div class="profile-icon"></div>
      </div>
    </header>

    <!-- 내비게이션 바 -->
    <nav class="nav-container">
      <a href="test.html" class="nav-item active">Test Search</a>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-container">
      <section class="section-block">
        <h2>도서 검색 테스트</h2>

        <!-- 검색 폼 -->
        <form class="search-form" id="searchForm">
          <div class="search-input-wrapper">
            <input
              type="text"
              id="searchInput"
              placeholder="검색어를 입력하세요 (예: 클린코드, 파이썬, 소설)"
            />
            <button type="submit" class="search-btn">🔍</button>
          </div>
        </form>

        <!-- 검색 결과가 출력될 영역 -->
        <div id="resultContainer" class="results-wrapper">
          <p class="placeholder-text">
            검색어를 입력하고 검색 버튼을 눌러주세요.
          </p>
        </div>
      </section>
    </main>

    <!-- 푸터 -->
    <footer class="footer-container">
      <p>개발자 이메일: example@email.com</p>
    </footer>

    <!-- 자바스크립트 파일 연결 (body 맨 아래) -->
    <script src="test.js"></script>
  </body>
</html>
